services:
  postgres:
    image: postgres:16-alpine
    container_name: fleet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet_dev_password
      POSTGRES_DB: fleet_management
    ports:
      - "5432:5432"
    volumes:
      - fleet_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fleet_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  fleet_postgres_data:
